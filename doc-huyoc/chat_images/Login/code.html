<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-container to-primary flex items-center justify-center shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">fluid</span>
</div>
<span class="font-headline font-extrabold text-2xl tracking-tighter text-primary">Velocity Flux</span>
</div>
<div class="hidden md:flex items-center gap-6">
<a class="text-label-sm font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Documentation</a>
<a class="text-label-sm font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center px-6 py-24 relative overflow-hidden">
<!-- Abstract Decorative Elements -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Glassmorphism Form Card -->
<div class="glass-card rounded-[2.5rem] p-10 md:p-12 shadow-2xl shadow-black/40 relative border border-outline-variant/10">
<div class="mb-10 text-center md:text-left">
<h1 class="font-headline text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">Enter your email to receive a secure magic link for instant access.</p>
</div>
<form action="#" class="space-y-8" method="POST">
<!-- Email Input Field -->
<div class="relative group">
<input class="peer w-full bg-surface-container-high text-on-surface px-5 pt-7 pb-3 rounded-2xl border border-outline-variant/15 outline-none focus:border-primary/50 focus:ring-4 focus:ring-primary/10 transition-all placeholder-transparent" id="email" name="email" placeholder="Email Address" required="" type="email"/>
<label class="absolute left-5 top-5 text-on-surface-variant text-sm transition-all pointer-events-none peer-placeholder-shown:top-5 peer-placeholder-shown:text-base peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary peer-[:not(:placeholder-shown)]:top-2 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:text-primary" for="email">
                            Email Address
                        </label>
</div>
<!-- Primary CTA -->
<button class="w-full py-4 px-6 rounded-2xl bg-gradient-to-br from-primary-container to-primary text-white font-semibold tracking-wide flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(79,70,229,0.4)] active:scale-[0.98] transition-all duration-200" type="submit">
<span>Send Magic Link</span>
<span class="material-symbols-outlined text-[20px]">magic_button</span>
</button>
</form>
<!-- Divider -->
<div class="my-10 flex items-center gap-4">
<div class="flex-1 h-[1px] bg-outline-variant/20"></div>
<span class="text-on-surface-variant text-xs font-medium uppercase tracking-widest">or</span>
<div class="flex-1 h-[1px] bg-outline-variant/20"></div>
</div>
<!-- Secondary CTA: Telegram -->
<button class="w-full py-4 px-6 rounded-2xl bg-surface-container-highest text-on-surface font-medium flex items-center justify-center gap-3 border border-outline-variant/10 hover:bg-surface-bright active:scale-[0.98] transition-all duration-200 group" type="button">
<span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">send</span>
<span>Login with Telegram</span>
</button>
<!-- Footer Policy -->
<div class="mt-10 text-center">
<p class="text-[11px] text-on-surface-variant leading-relaxed px-4">
                        By continuing, you agree to our 
                        <a class="text-primary hover:underline underline-offset-4" href="#">Terms of Service</a>

                        <a class="text-primary hover:underline underline-offset-4" href="#">Privacy Policy</a>.

</div>

<span class="material-symbols-outlined text-sm">help</span>
