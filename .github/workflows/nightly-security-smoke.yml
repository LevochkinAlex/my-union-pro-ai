name: Nightly Security Smoke

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  security-role-runtime-smoke:
    # Skip when smoke secrets are not configured (no daily failure emails)
    if: ${{ secrets.SEC_SMOKE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run runtime role smoke checks
        env:
          SEC_SMOKE_STRICT: "1"
          SEC_SMOKE_BASE_URL: ${{ secrets.SEC_SMOKE_BASE_URL }}
          SEC_SMOKE_COOKIE_REPORTS_ALLOW: ${{ secrets.SEC_SMOKE_COOKIE_REPORTS_ALLOW }}
          SEC_SMOKE_COOKIE_REPORTS_DENY: ${{ secrets.SEC_SMOKE_COOKIE_REPORTS_DENY }}
          SEC_SMOKE_COOKIE_APPEALS_ALLOW: ${{ secrets.SEC_SMOKE_COOKIE_APPEALS_ALLOW }}
          SEC_SMOKE_COOKIE_APPEALS_DENY: ${{ secrets.SEC_SMOKE_COOKIE_APPEALS_DENY }}
          SEC_SMOKE_COOKIE_CHATS_ALLOW: ${{ secrets.SEC_SMOKE_COOKIE_CHATS_ALLOW }}
          SEC_SMOKE_COOKIE_CHATS_DENY: ${{ secrets.SEC_SMOKE_COOKIE_CHATS_DENY }}
          SEC_SMOKE_COOKIE_MEETINGS_ALLOW_CREATE: ${{ secrets.SEC_SMOKE_COOKIE_MEETINGS_ALLOW_CREATE }}
          SEC_SMOKE_COOKIE_MEETINGS_DENY_CREATE: ${{ secrets.SEC_SMOKE_COOKIE_MEETINGS_DENY_CREATE }}
        run: pnpm test:security:runtime
