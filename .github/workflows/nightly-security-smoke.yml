name: Nightly Security Smoke

# workflow_dispatch only. Smoke never fails the workflow (exit 0 always) — only annotations in log.
# Реальные проверки: node --test scripts/security-role-runtime-smoke.mjs
on:
  workflow_dispatch:

jobs:
  security-role-runtime-smoke:
    if: ${{ secrets.SEC_SMOKE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Явно exit 0: иначе в UI/уведомлениях "failed" даже при continue-on-error в некоторых сценариях.
      - name: Run runtime role smoke checks (non-failing)
        env:
          SEC_SMOKE_SKIP_MEETINGS_POST: "1"
          SEC_SMOKE_BASE_URL: ${{ secrets.SEC_SMOKE_BASE_URL }}
          SEC_SMOKE_COOKIE_REPORTS_ALLOW: ${{ secrets.SEC_SMOKE_COOKIE_REPORTS_ALLOW }}
          SEC_SMOKE_COOKIE_REPORTS_DENY: ${{ secrets.SEC_SMOKE_COOKIE_REPORTS_DENY }}
          SEC_SMOKE_COOKIE_APPEALS_ALLOW: ${{ secrets.SEC_SMOKE_COOKIE_APPEALS_ALLOW }}
          SEC_SMOKE_COOKIE_APPEALS_DENY: ${{ secrets.SEC_SMOKE_COOKIE_APPEALS_DENY }}
          SEC_SMOKE_COOKIE_CHATS_ALLOW: ${{ secrets.SEC_SMOKE_COOKIE_CHATS_ALLOW }}
          SEC_SMOKE_COOKIE_CHATS_DENY: ${{ secrets.SEC_SMOKE_COOKIE_CHATS_DENY }}
          SEC_SMOKE_COOKIE_MEETINGS_ALLOW_CREATE: ${{ secrets.SEC_SMOKE_COOKIE_MEETINGS_ALLOW_CREATE }}
          SEC_SMOKE_COOKIE_MEETINGS_DENY_CREATE: ${{ secrets.SEC_SMOKE_COOKIE_MEETINGS_DENY_CREATE }}
        run: |
          set +e
          node --test scripts/security-role-runtime-smoke.mjs
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Security smoke failed (exit $code). Refresh SEC_SMOKE_COOKIE_* — docs/SECURITY_SMOKE_NIGHTLY.md"
          else
            echo "Security smoke finished OK"
          fi
          exit 0
